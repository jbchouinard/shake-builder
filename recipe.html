<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf7ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0c15" media="(prefers-color-scheme: dark)">
<title>Shake recipe</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="recipe-page">
<div class="wrap" id="recipe">

  <div id="banner" hidden class="banner"></div>
  <p class="nav"><a href="saved.html">Saved recipes</a></p>

  <h1 id="r-name">Shake</h1>
  <p class="note" id="r-yield">Makes 1 serving.</p>

  <h2>Ingredients</h2>
  <ul class="recipe-ingredients" id="r-ingredients"></ul>

  <h2>Nutrition</h2>
  <table class="nutrition">
    <thead>
      <tr><th scope="col">&nbsp;</th><th scope="col">Per serving</th><th scope="col">Total</th></tr>
    </thead>
    <tbody>
      <tr><td>Calories</td><td id="r-kcal">0</td><td id="r-kcal-t">0</td></tr>
      <tr><td><b>Net carbs (g)</b></td><td id="r-netCarb">0</td><td id="r-netCarb-t">0</td></tr>
      <tr><td>&nbsp;&nbsp;Total carbs (g)</td><td id="r-carb">0</td><td id="r-carb-t">0</td></tr>
      <tr><td>&nbsp;&nbsp;Fiber (g)</td><td id="r-fiber">0</td><td id="r-fiber-t">0</td></tr>
      <tr><td>Protein (g)</td><td id="r-protein">0</td><td id="r-protein-t">0</td></tr>
      <tr><td>Fat (g)</td><td id="r-fat">0</td><td id="r-fat-t">0</td></tr>
    </tbody>
  </table>

  <div class="actions">
    <button class="btn" id="save-recipe" type="button">Save</button>
    <button class="btn" id="copy-ingredients" type="button">Copy ingredients</button>
    <a class="btn btn-primary" id="edit" href="index.html">Edit recipe</a>
  </div>

</div>

<script src="js/shared.js"></script>
<script src="js/store.js"></script>
<script src="js/recipe.js"></script>
</body>
</html>
